# TOS 性能监测 — iframe 内部打开的路由配置
# 由 postinst 复制到 /etc/nginx/conf.d/tos-perfmon-app.conf
#
# 背景与取舍：
#  1) 应用 id "tos-perfmon" 会被平台自带规则前缀命中：
#       nginx-extend.conf:  location ~ ^/tos(/.*)? { proxy_pass ...:5050/tos$1; }
#     正则优先于普通前缀匹配，导致 /tos-perfmon/ 被转给 TOSDaemon 后 301 → /tos/，
#     表现为 iframe 里又渲染出一个 TOS 桌面（"套娃"）。
#     故必须用 ^~ 抢占。
#
#  2) 窗口外壳（关闭 X / 最小化 / 最大化 / 拖拽缩放）由 TOS 前端 JS 依据
#     config.ini 的 resize / maxmin / width / height 渲染，与 nginx 无关，
#     因此 ^~ 不会影响外壳，只影响资源从哪取。
#
#  3) 静态页面从应用 webui 目录直接提供（与平台应用 calendar 一致），
#     仅 /api/ 反代到后端服务，避免把整站请求都塞给 Python。

# API：反代到后端 HTTP 服务
location ^~ /tos-perfmon/api/ {
    proxy_pass http://127.0.0.1:8790/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_buffering off;
}

# 前端静态资源：直接读文件（webui 目录软链自应用目录）
location ^~ /tos-perfmon/ {
    alias /usr/www/tos-perfmon/;
    index index.html;
    try_files $uri $uri/ /tos-perfmon/index.html;
}

# 平台 iframe 代理路径，同样处理
location ^~ /v2/proxy/tos-perfmon/api/ {
    proxy_pass http://127.0.0.1:8790/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_buffering off;
}

location ^~ /v2/proxy/tos-perfmon/ {
    alias /usr/www/tos-perfmon/;
    index index.html;
    try_files $uri $uri/ /v2/proxy/tos-perfmon/index.html;
}
